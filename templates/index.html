<!DOCTYPE html>
<html>

<head>
<title>AI Chatbot</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="chat-container">

    <!-- Navbar -->

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:20px;
        background:#1e293b;
        border-bottom:1px solid #334155;
    ">

        <div>

            <h1 style="
                margin:0;
                font-size:28px;
            ">
                🤖 AI Assistant
            </h1>

        </div>

        <div>

            <span style="
                color:#93c5fd;
                margin-right:20px;
                font-weight:bold;
            ">
                Welcome, {{ session.username }}
            </span>

            <a href="/history"
               style="
               color:white;
               text-decoration:none;
               margin-right:20px;
               font-weight:bold;
               ">
                📜 History
            </a>

            <a href="/dashboard"
               style="
               color:white;
               text-decoration:none;
               margin-right:20px;
               font-weight:bold;
               ">
                📊 Dashboard
            </a>

            <a href="/logout"
               style="
               color:#ef4444;
               text-decoration:none;
               font-weight:bold;
               ">
                Logout
            </a>

        </div>

    </div>

    <!-- Chat Area -->

    <div id="chatbox"></div>

    <!-- Input Area -->

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask me anything...">

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
