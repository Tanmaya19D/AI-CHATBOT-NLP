<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );
        }

        .card{
            width:100%;
            max-width:460px;
            background:white;
            padding:40px;
            border-radius:20px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#1e293b;
            font-size:30px;
        }

        .error{
            padding:12px;
            margin-bottom:18px;
            border-radius:9px;

            background:#fee2e2;
            border:1px solid #fecaca;
            color:#b91c1c;

            text-align:center;
            font-size:14px;
        }

        .success{
            padding:12px;
            margin-bottom:18px;
            border-radius:9px;

            background:#dcfce7;
            border:1px solid #bbf7d0;
            color:#166534;

            text-align:center;
            font-size:14px;
        }

        .input-group{
            margin-bottom:16px;
        }

        label{
            display:block;
            margin-bottom:7px;
            color:#334155;
            font-weight:600;
        }

        input{
            width:100%;
            padding:14px;

            border:1px solid #d1d5db;
            border-radius:10px;

            font-size:15px;
            outline:none;
        }

        input:focus{
            border-color:#22c55e;

            box-shadow:
                0 0 0 3px
                rgba(34,197,94,0.12);
        }

        button{
            width:100%;
            padding:14px;

            border:none;
            border-radius:10px;

            background:#22c55e;
            color:white;

            font-size:16px;
            font-weight:600;
            cursor:pointer;
        }

        button:hover{
            background:#16a34a;
        }

        .login-link{
            display:block;
            margin-top:18px;

            text-align:center;
            text-decoration:none;

            color:#2563eb;
            font-weight:700;
        }

        .login-link:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>📝 Create Account</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% if success_message %}
            <div class="success">
                {{ success_message }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div class="input-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    type="password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <a
            class="login-link"
            href="{{ url_for('login') }}"
        >
            Already have an account? Login
        </a>

    </div>

</body>

</html>
